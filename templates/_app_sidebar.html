{# Shared app sidebar. Set `active` ('dash' | 'etsy' | 'cfg') before including.
   The accounts list (#side-accounts) is filled by each page's script via AppSidebar.renderAccounts(). #}
<div class="mbar">
    <button type="button" class="icon-btn" id="side-open" aria-label="Mở menu" aria-controls="app-side" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <span class="mark" aria-hidden="true">A</span><b>AppMail</b>
    <button class="icon-btn theme-toggle" type="button" onclick="toggleTheme()" aria-label="Đổi giao diện"></button>
</div>
<div class="side-scrim" id="side-scrim" hidden></div>
<aside class="app-side" id="app-side" aria-label="Thanh bên">
    <a class="brand" href="/">
        <span class="mark" aria-hidden="true">A</span>
        <span>AppMail<small>Gmail → Google Sheets</small></span>
    </a>
    <nav class="side-nav" aria-label="Menu chính">
        <a href="/#overview" data-nav="dash" {% if active == 'dash' %}aria-current="page"{% endif %}>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>Tổng quan</a>
        <a href="/etsy" data-nav="etsy" {% if active == 'etsy' %}aria-current="page"{% endif %}>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>Đơn Etsy</a>
        <a href="/#config" data-nav="cfg" {% if active == 'cfg' %}aria-current="page"{% endif %}>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>Cấu hình</a>
    </nav>
    <div class="side-accounts">
        <div class="side-label">Tài khoản</div>
        <div class="acc-nav" id="side-accounts"><span class="side-muted">Đang tải…</span></div>
    </div>
    <div class="side-foot">
        <span class="avatar" aria-hidden="true">AD</span>
        <span class="who">admin<small id="side-interval">&nbsp;</small></span>
        <button class="icon-btn theme-toggle" type="button" onclick="toggleTheme()" aria-label="Đổi giao diện"></button>
        <a class="icon-btn" href="/logout" aria-label="Đăng xuất" title="Đăng xuất">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
        </a>
    </div>
</aside>
